services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shlab_dev_only}
      POSTGRES_DB: shlab
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shlab']
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  pgdata:
